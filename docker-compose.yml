# Postgres -> Debezium -> Kafka -> Flink -> Fluss -> Iceberg (S3 + Glue) -> Athena.
# Requires COMPOSE_ENV_FILES=versions.env,.env.infra,.env. All host ports bind to 127.0.0.1.
#
# "$${VAR}" in FLUSS_PROPERTIES is left as "${VAR}" by Compose and expanded by envsubst inside the
# Fluss container, so the keys are not inlined into FLUSS_PROPERTIES. `docker compose config` still
# prints them under environment: do not run it while sharing your screen.

x-aws-env: &aws-env
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-ap-southeast-1}
  AWS_DEFAULT_REGION: ${AWS_REGION:-ap-southeast-1}
  TZ: UTC

services:
  # --- CDC source ---
  postgres:
    image: ${REGISTRY_PREFIX:-docker.io}/${POSTGRES_IMAGE:?versions.env not loaded - set COMPOSE_ENV_FILES (README step 1)}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab      # local-only credential; port bound to 127.0.0.1
      POSTGRES_DB: shop
      TZ: UTC
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d shop"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka:
    image: ${REGISTRY_PREFIX:-docker.io}/${KAFKA_IMAGE}
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk   # sample value from the apache/kafka image docs
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  schema-registry:
    image: ${REGISTRY_PREFIX:-docker.io}/${SCHEMA_REGISTRY_IMAGE}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      TZ: UTC
    ports:
      - "127.0.0.1:${SCHEMA_REGISTRY_PORT:-8081}:8081"
    # The image ships without curl/nc; probe over bash /dev/tcp.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081; printf \"GET /subjects HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 30

  connect:
    build:
      context: ./connect
      args:
        CONNECT_BASE_IMAGE: ${QUAY_REGISTRY_PREFIX:-quay.io}/${CONNECT_BASE_IMAGE}
        TERRAFORM_IMAGE: ${REGISTRY_PREFIX:-docker.io}/${TERRAFORM_IMAGE}
        MAVEN_REPO: ${MAVEN_REPO:-https://repo1.maven.org/maven2}
        CONFLUENT_MAVEN_REPO: ${CONFLUENT_MAVEN_REPO:-https://packages.confluent.io/maven}
    image: flusslab/connect:${CONFLUENT_AVRO_CONVERTER_VERSION}-local
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-lab
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      TZ: UTC
    volumes:
      - ./connect/register-postgres.json:/opt/lab/register-postgres.json:ro
    ports:
      - "127.0.0.1:${CONNECT_PORT:-8084}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  kafka-ui:
    image: ${REGISTRY_PREFIX:-docker.io}/${KAFKA_UI_IMAGE}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      TZ: UTC
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"

  # --- Fluss ---
  zookeeper:
    image: ${REGISTRY_PREFIX:-docker.io}/${ZOOKEEPER_IMAGE}
    restart: always

  coordinator-server:
    build:
      context: ./fluss
      args:
        FLUSS_IMAGE: ${REGISTRY_PREFIX:-docker.io}/${FLUSS_IMAGE}
        MAVEN: ${MAVEN_REPO:-https://repo1.maven.org/maven2}
        ICEBERG_VERSION: ${ICEBERG_VERSION}
        FAILSAFE_VERSION: ${FAILSAFE_VERSION}
    image: flusslab/fluss:1.0.0-glue-local
    command: coordinatorServer
    depends_on:
      - zookeeper
    environment:
      <<: *aws-env
      LAB_BUCKET: ${LAB_BUCKET:?LAB_BUCKET missing in .env.infra}
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper:2181
        bind.listeners: FLUSS://coordinator-server:9123
        remote.data.dir: s3://$${LAB_BUCKET}/fluss-remote
        s3.access-key: $${AWS_ACCESS_KEY_ID}
        s3.secret-key: $${AWS_SECRET_ACCESS_KEY}
        s3.region: $${AWS_REGION}
        datalake.enabled: true
        datalake.format: iceberg
        datalake.iceberg.type: glue
        datalake.iceberg.warehouse: s3://$${LAB_BUCKET}/iceberg-warehouse
        datalake.iceberg.client.region: $${AWS_REGION}
        datalake.iceberg.io-impl: org.apache.iceberg.aws.s3.S3FileIO

  tablet-server:
    image: flusslab/fluss:1.0.0-glue-local
    command: tabletServer
    depends_on:
      - coordinator-server
    environment:
      <<: *aws-env
      LAB_BUCKET: ${LAB_BUCKET:?LAB_BUCKET missing in .env.infra}
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper:2181
        bind.listeners: FLUSS://tablet-server:9123
        data.dir: /tmp/fluss/data
        kv.snapshot.interval: ${KV_SNAPSHOT_INTERVAL:-30s}
        remote.data.dir: s3://$${LAB_BUCKET}/fluss-remote
        s3.access-key: $${AWS_ACCESS_KEY_ID}
        s3.secret-key: $${AWS_SECRET_ACCESS_KEY}
        s3.region: $${AWS_REGION}
        datalake.enabled: true
        datalake.format: iceberg
        datalake.iceberg.type: glue
        datalake.iceberg.warehouse: s3://$${LAB_BUCKET}/iceberg-warehouse
        datalake.iceberg.client.region: $${AWS_REGION}
        datalake.iceberg.io-impl: org.apache.iceberg.aws.s3.S3FileIO

  # --- Flink ---
  jobmanager:
    build:
      context: ./flink
      args:
        FLINK_BASE_IMAGE: ${REGISTRY_PREFIX:-docker.io}/${FLINK_BASE_IMAGE}
        MAVEN: ${MAVEN_REPO:-https://repo1.maven.org/maven2}
        FLINK_KAFKA_CONNECTOR_VERSION: ${FLINK_KAFKA_CONNECTOR_VERSION}
        FLINK_AVRO_CONFLUENT_VERSION: ${FLINK_AVRO_CONFLUENT_VERSION}
        FAILSAFE_VERSION: ${FAILSAFE_VERSION}
    image: flusslab/flink:1.20-1.0.0-lab-local
    entrypoint: ["/opt/flink/init_iceberg.sh"]
    command: ["jobmanager"]
    depends_on:
      - coordinator-server
      - tablet-server
    environment:
      <<: *aws-env
      LAB_BUCKET: ${LAB_BUCKET:?LAB_BUCKET missing in .env.infra}   # read by the tiering job
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        rest.bind-address: 0.0.0.0
    volumes:
      - ./sql:/opt/lab/sql:ro
    ports:
      - "127.0.0.1:${FLINK_UI_PORT:-8083}:8081"

  taskmanager:
    image: flusslab/flink:1.20-1.0.0-lab-local
    entrypoint: ["/opt/flink/init_iceberg.sh"]
    command: ["taskmanager"]
    depends_on:
      - jobmanager
    environment:
      <<: *aws-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 10
        taskmanager.memory.process.size: 2048m
        taskmanager.memory.task.off-heap.size: 128m

  # --- AWS tooling ---
  aws:
    image: ${REGISTRY_PREFIX:-docker.io}/${AWS_CLI_IMAGE}
    entrypoint: ["sleep", "infinity"]
    environment:
      <<: *aws-env
      LAB_BUCKET: ${LAB_BUCKET:?LAB_BUCKET missing in .env.infra}

  # On Linux, export LAB_UID/LAB_GID so files written under infra/ stay owned by you.
  infra:
    profiles: ["infra"]
    build:
      context: ./infra
      args:
        TERRAFORM_IMAGE: ${REGISTRY_PREFIX:-docker.io}/${TERRAFORM_IMAGE}
        TERRAGRUNT_VERSION: ${TERRAGRUNT_VERSION}
        GITHUB_MIRROR: ${GITHUB_MIRROR:-https://github.com}
    image: flusslab/infra:${TERRAGRUNT_VERSION}-local
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    working_dir: /lab/infra/lab/ap-southeast-1
    environment:
      <<: *aws-env
      HOME: /tmp
      TF_STATE_BUCKET: ${TF_STATE_BUCKET:?TF_STATE_BUCKET missing in .env.infra}
      LAB_BUCKET: ${LAB_BUCKET:?LAB_BUCKET missing in .env.infra}
      TG_NON_INTERACTIVE: "true"
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      CHECKPOINT_DISABLE: "1"
      GITHUB_MIRROR: ${GITHUB_MIRROR:-}
      TF_REGISTRY_MIRROR: ${TF_REGISTRY_MIRROR:-}
    volumes:
      - ./infra:/lab/infra
